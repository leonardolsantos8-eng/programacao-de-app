<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="painel">
        <h1>Gerador de tabuada</h1>

        <label for="numero-input">Digite um numero:</label>
        <input type="number" id="numero-input" placeholder="Ex.: 5">
        <button id="btn-gerar">Gerar tabuada</button>

        <div id="resultado-aqui">
            <!-- a tabuada será gerada aqui -->
            <!-- so mostrará conteudo quando o script.js gerar a tabuada -->
        </div>

        <section class="caixa-boba">
            <h2>🦄 Coisa boba do dia</h2>
            <p id="frase-boba">Um panda tentando fazer café.</p>
            <button id="btn-caos" class="caos-btn">Gerar caos</button>
        </section>
    </div>

    <!-- o comando abaixo ira chamar o arquivo JS. -->
    <script src="script.js"></script>
</body>
</html>
